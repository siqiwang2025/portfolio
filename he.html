<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图片展示 - 以和为贵项目</title>

  </style>
</head>
<body>

  <div class="gallery">
    <img src="he/image1.jpg" alt="以和为贵图片 1">
    <img src="he/image2.gif" alt="以和为贵图片 2">
    <img src="he/image3.gif" alt="以和为贵图片 3">
    <img src="he/image4.png" alt="以和为贵图片 4">
    <img src="he/image5.png" alt="以和为贵图片 5">
    <img src="he/image6.png" alt="以和为贵图片 6">
    <img src="he/image7.png" alt="以和为贵图片 7">
    <img src="he/image8.gif" alt="以和为贵图片 8">

</body>
</html>
