<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siqi Wang Thesis Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
            text-align: center;
        }
        header {
            background: #333;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        .gallery {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: left;
        }
        .gallery img {
            width: 150px;
            height: auto;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.1);
        }
        .bookshelf {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: left;
        }
        .book-item {
            padding: 10px;
            margin: 10px 0;
            background: #f8f8f8;
            border-left: 5px solid #ff758c;
            cursor: pointer;
            transition: background 0.3s;
        }
        .book-item:hover {
            background: #ffebf0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Post-Globalization and Digital Spaces</h1>
        <p>Siqi Wang Thesis Project</p>
    </header>
    
    <div class="container">
        <div class="gallery">
            <h2>有趣推文 Gallery</h2>
            <p>点击图片查看完整推文截图</p>
            <a href="https://example.com/tweet1" target="_blank"><img src="https://example.com/tweet1.jpg" alt="推文截图1"></a>
            <a href="https://example.com/tweet2" target="_blank"><img src="https://example.com/tweet2.jpg" alt="推文截图2"></a>
            <a href="https://example.com/tweet3" target="_blank"><img src="https://example.com/tweet3.jpg" alt="推文截图3"></a>
        </div>
        
        <div class="bookshelf">
            <h2>书架（有趣新闻）</h2>
            <p>点击标题查看完整新闻</p>
            <div class="book-item" onclick="window.open('https://news.example.com/article1', '_blank')">TikTok Refugee 现象分析</div>
            <div class="book-item" onclick="window.open('https://news.example.com/article2', '_blank')">Xiaohongshu 在美国用户增长数据</div>
            <div class="book-item" onclick="window.open('https://news.example.com/article3', '_blank')">TikTok 被禁对网红经济的影响</div>
        </div>
    </div>
</body>
</html>
