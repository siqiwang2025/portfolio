<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>

    <title>Siqi Wang Thesis Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
        }
        
        .intro {
    font-family: 'Times New Roman', serif;
    font-size: 16px;
    color: #000000;
    }

        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
            text-align: center;
        }

        


         header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
        }
        .interactive-button {
            margin-top: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 500px;
            height: 500px;
            font-size: 18px;
            color: white;
            background: linear-gradient(45deg, #fe2d56, #fb5a79);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s;
        }
        .interactive-button:hover {
            transform: scale(1.1);
            background: linear-gradient(45deg, #ff589b, #ff3d73);
        }
        .content {
    background-color: #1e1e1e;
    color: #ffffff;
    padding: 20px;
    margin-top: 20px;
    border-radius: 5px;
    box-shadow: 0 0 10px #00f2ea;
    text-align: left;
    margin-left: auto;
    margin-right: auto;
}

        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .hero h1 {
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        

/* 适配小屏幕 */
@media screen and (max-width: 768px) {
    .timeline::before {
        left: 20px;
    }

    .timeline-item {
        width: 100%;
        left: 0 !important;
        text-align: left;
        padding-left: 50px;
    }

    .timeline-dot {
        left: 20px !important;
    }
}


/* 让标签依次出现 */
@keyframes fadeInTag {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* 适配小屏幕 */
@media screen and (max-width: 768px) {
    .tag {
        font-size: 12px;
        padding: 8px 12px;
    }
}

man {
  --font: "skolar-sans-latin", sans-serif;
  --really-green: #fe2c55;
  --green: #25f4ee;
  --black: oklch(22.21% 0 0);
  --gray: oklch(83.9% 0 0);
  --speed: 1200ms;

  height: 100%;
  font-family: var(--font);
  background-color: var(--black);
  color: var(--gray);
  padding-top: 150px;
  padding-bottom: 200px;

  & * {
    font-family: Montserrat, sans-serif;
  }
}

man { padding-top: 150px;
  padding-bottom: 200px;
  place-content: center;
  place-items: center;
  text-align: center;
  gap: 88px;

  
  & article {
    display: grid;
    gap: 52px;}
 

  & h1 {
    color: var(--green);
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 3px;
  }

  & h2 {
    font-size: 4.5vw;
    text-transform: uppercase;
  }
}

*[letter-animation="breath"] {
  & > span {
    display: inline-block;
    white-space: break-spaces;
  }

  & > span {
    animation: breath calc(var(--speed)) ease calc(var(--index) * 100 * 1ms)
      infinite alternate;
  }
}

man article {
  margin-top: 250px;
  margin-bottom: 150px;
  text-align: center;
}


section {
  width: 100%;
  display: grid;
  place-content: center;
  place-items: center;

  & div {
    width: 50vw;

    & span {

      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.025ch;
      position: relative;
      margin-block-end: 8px;
    }

    & span:first-of-type {
      float: left;
      left: -12px;
    }

    & span:last-of-type {
      float: right;
      right: -12px;
    }
  }

  & input[type="range"] {
    width: 100%;
  }
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-runnable-track {
  background: var(--green);
  height: 0.5rem;
  border-radius: 12px;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; /* Override default look */
  appearance: none;
  margin-top: -12px;
  background-color: oklch(22.21% 0 0);
  border: 1px solid oklch(38% 0 0);
  border-radius: 8px;
  height: 2rem;
  width: 1.25rem;
}

@keyframes breath {
  from {
    animation-timing-function: ease-out;
  }
  to {
    transform: scale(1.25) translateY(-5px) perspective(1px);
    text-shadow: 0 0 20px var(--really-green);
    animation-timing-function: ease-in-out;
  }
}

    </style>
</head>

<body>

    <man>
  <article>
    <h1 split-by="letter" letter-animation="breath">Chronicle of Digital Globalization</h1>
  </article> 
  <section>
    <div>

      <span>Now</span>
      <span>Before</span>
      <input min="100" max="2400" type="range" />
    </div>
  </section></man>

        

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const timelineItems = document.querySelectorAll(".timeline-item");
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("show");
                    }
                });
            }, { threshold: 0.1 });
            
            timelineItems.forEach(item => observer.observe(item));
        });

        function editContent(element) {
            let newText = prompt("修改时间线内容:", element.innerText);
            if (newText) {
                element.innerText = newText;
            }
        }
    </script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        var elem = document.querySelector('.gallery');
        var msnry = new Masonry(elem, {
            itemSelector: 'a',  // 选择 Masonry 布局的单元
            columnWidth: 150,    // 每列宽度
            gutter: 10,          // 间距
            percentPosition: true // 让 Masonry 根据容器动态调整
        });

        // **关键：在图片加载完成后，触发 Masonry 重新布局**
        var imgLoad = imagesLoaded(elem);
        imgLoad.on('progress', function () {
            msnry.layout();
        });
    });
</script>

<script>
  const slider = document.querySelector('input[type="range"]');
  const root = document.querySelector("article");

  const span = (text, index) => {
    const node = document.createElement("span");
    node.textContent = text;
    node.style.setProperty("--index", index);
    return node;
  };

  const byLetter = (text) => [...text].map(span);
  const byWord = (text) => text.split(" ").map(span);

  const { matches: motionOK } = window.matchMedia("(prefers-reduced-motion: no-preference)");

  if (motionOK) {
    const splitTargets = document.querySelectorAll("[split-by]");

    splitTargets.forEach((node) => {
      const type = node.getAttribute("split-by");
      let nodes = null;
      if (type === "letter") nodes = byLetter(node.innerText);
      else if (type === "word") nodes = byWord(node.innerText);
      if (nodes) {
        node.innerHTML = ""; // 清空原内容
        nodes.forEach((n) => node.appendChild(n)); // 添加 span 包裹后的字
      }
    });
  }

  function onInput() {
    const value = slider.value;
    root.style.setProperty("--speed", `${value}ms`);
  }

  if (slider) {
    slider.addEventListener("input", debounce(onInput, 10));
  }

  function debounce(func, wait) {
    let timeoutId;
    return function () {
      const context = this;
      const args = arguments;
      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => {
        func.apply(context, args);
      }, wait);
    };
  }
</script>

</body>
</html>
