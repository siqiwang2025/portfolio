<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>游戏相关设计</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
      background-color: #f9f9f9;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 20px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>
  <h2>游戏相关作品展示</h2>
  <div class="gallery">
  
    <img src="game/image1.jpg" alt="Image 1">
    <video controls width="100%" style="margin-bottom: 20px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.08);">
    <source src="game/video1.mp4" type="video/mp4"></video>
  

    <img src="game/image2.jpg" alt="Image 2">
    <video controls width="100%" style="margin-bottom: 20px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.08);">
    <source src="game/video2.mp4" type="video/mp4"></video>

      <video controls width="100%" style="margin-bottom: 20px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.08);">

  </div>

</html>
