<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | [Your Name]</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
        }
        .hero {
            text-align: center;
            padding: 100px 0;
        }
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 50px;
        }
        .project-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>[Your Name]</h1>
            <nav>
                <a href="#projects">Projects</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>
        <section class="hero">
            <h2>Welcome to My Portfolio</h2>
            <p>Showcasing my work in UX/UI & Interaction Design</p>
        </section>
        <section id="projects" class="projects">
            <div class="project-card">
                <h3>Project 1</h3>
                <p>Description of the project.</p>
            </div>
            <div class="project-card">
                <h3>Project 2</h3>
                <p>Description of the project.</p>
            </div>
        </section>
        <section id="about" class="about">
            <h2>About Me</h2>
            <p>Brief bio and background.</p>
        </section>
        <section id="contact" class="contact">
            <h2>Contact</h2>
            <p>Email: your.email@example.com</p>
        </section>
    </div>
</body>
</html>
